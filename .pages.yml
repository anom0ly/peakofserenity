# Pages CMS configuration (https://pagescms.org). Authors sign in by email invite; every Save commits to
# this repo and Cloudflare Pages rebuilds the site.
# GENERATED by tools/pages_config.py from src/guideTypes.json and blog/authors.yml: edit those (or the script)
# and re-run it rather than editing this file by hand.
media:
  input: static/img
  output: /img
components:
  authors:
    label: Authors
    type: select
    options:
      values:
      - abelito75
      - anomoly
      - babylonius
      - brewingscribe
      - calligraphy
      - celestiel
      - chavian
      - drezington
      - eliro
      - emallson
      - garg
      - griff
      - home
      - hurstilol
      - j-funk
      - jove
      - juko
      - kamp
      - kiov
      - labyrinth
      - mickey
      - mymiro
      - pandanaconda
      - paoanii
      - rivers
      - ruhye
      - scurch
      - seiryoku
      - shrike
      - sinzhu
      - syrupsss
      - talby
      - total
      - xes
      - zuggie
      multiple: true
content:
- name: news
  label: News Posts
  type: collection
  path: blog
  filename: '{year}-{month}-{day}-{primary}.mdx'
  format: yaml-frontmatter
  view:
    fields:
    - title
    - date
    - authors
    primary: title
    sort:
    - date
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Title
    type: string
    required: true
  - name: date
    label: Publish date
    type: date
    required: true
    description: When it goes up. Its web address uses the day you first create it.
    options:
      time: true
      format: yyyy-MM-dd'T'HH:mm:ss
  - name: authors
    label: Author(s)
    component: authors
    required: true
    description: Pick yourself. Add co-authors if you wrote it together.
  - name: tags
    label: Tags
    type: string
    list: true
    description: Spec (Windwalker, Brewmaster, Mistweaver or General), patch number (e.g. 12.1), and any topics.
  - name: description
    label: Short summary
    type: text
    description: One or two sentences shown on the list page, in Google and in Discord link previews.
  - name: image
    label: Preview image
    type: image
    description: Optional. Shown when it is shared.
  - name: body
    label: Post
    type: rich-text
    options: &id001
      format: markdown
  - name: slug
    type: string
    hidden: true
  - name: wp_id
    type: number
    hidden: true
  - name: original_url
    type: string
    hidden: true
  exclude:
  - authors.yml
  - tags.yml
  operations:
    rename: false
