# Pages CMS configuration (https://pagescms.org). Authors sign in by email invite; every Save commits to
# this repo and Cloudflare Pages rebuilds the site. Guide tab fields mirror src/guideTypes.js.
media:
  input: static/img
  output: /img
content:
- name: news
  label: News Posts
  type: collection
  path: blog
  filename: '{year}-{month}-{day}-{primary}.mdx'
  format: yaml-frontmatter
  view:
    fields:
    - title
    - date
    - authors
    primary: title
    sort:
    - date
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Title
    type: string
    required: true
  - name: date
    label: Publish date
    type: date
    required: true
    description: The date in the post address comes from this date when the post is first created.
  - name: authors
    label: Author(s)
    type: select
    list: true
    required: true
    options:
      values:
      - abelito75
      - anomoly
      - babylonius
      - brewingscribe
      - calligraphy
      - celestiel
      - chavian
      - drezington
      - eliro
      - emallson
      - garg
      - griff
      - home
      - hurstilol
      - j-funk
      - jove
      - juko
      - kamp
      - kiov
      - labyrinth
      - mickey
      - mymiro
      - pandanaconda
      - paoanii
      - rivers
      - ruhye
      - scurch
      - seiryoku
      - shrike
      - sinzhu
      - syrupsss
      - talby
      - total
      - xes
      - zuggie
    description: Pick yourself. Add co-authors if you wrote it together.
  - name: tags
    label: Tags
    type: string
    list: true
    description: Spec (Windwalker, Brewmaster, Mistweaver or General), patch number (e.g. 12.1), and any topics.
  - name: description
    label: Short summary
    type: text
    description: One or two sentences shown on the news list, in Google and in Discord link previews.
  - name: image
    label: Preview image
    type: image
    description: Optional. Shown when the post is shared.
  - name: body
    label: Post
    type: rich-text
  - name: slug
    type: string
    hidden: true
  - name: wp_id
    type: number
    hidden: true
  - name: original_url
    type: string
    hidden: true
  exclude:
  - authors.yml
- name: guides
  label: Guides
  type: collection
  path: docs
  subfolders: true
  format: yaml-frontmatter
  view:
    fields:
    - title
    - last_update
    primary: title
  fields:
  - name: title
    label: Guide title
    type: string
    required: true
  - name: last_update
    label: Last updated
    type: object
    description: Change this date whenever you update the guide; it shows at the bottom of the page.
    fields:
    - name: date
      label: Date
      type: date
  - name: authors
    label: Authors
    type: select
    list: true
    options:
      values:
      - abelito75
      - anomoly
      - babylonius
      - brewingscribe
      - calligraphy
      - celestiel
      - chavian
      - drezington
      - eliro
      - emallson
      - garg
      - griff
      - home
      - hurstilol
      - j-funk
      - jove
      - juko
      - kamp
      - kiov
      - labyrinth
      - mickey
      - mymiro
      - pandanaconda
      - paoanii
      - rivers
      - ruhye
      - scurch
      - seiryoku
      - shrike
      - sinzhu
      - syrupsss
      - talby
      - total
      - xes
      - zuggie
  - name: description
    label: Short summary
    type: text
    description: One or two sentences for Google and link previews.
  - name: intro
    label: Introduction
    type: rich-text
    description: The text at the top of the guide, under the banner.
  - name: builds
    label: Talent Builds
    type: object
    fields:
    - name: heading
      label: Section heading
      type: string
      description: The title shown above these tabs.
    - name: intro
      label: Text above the tabs
      type: rich-text
      description: Optional. Shown between the heading and the tabs.
    - name: classtree
      label: 'Tab: Class Tree'
      type: rich-text
      description: Everything shown when a reader clicks the "Class Tree" tab. Paste talent import strings exactly as they
        are.
    - name: raid
      label: 'Tab: Raid'
      type: rich-text
      description: Everything shown when a reader clicks the "Raid" tab. Paste talent import strings exactly as they are.
    - name: mythicplus
      label: 'Tab: Mythic+'
      type: rich-text
      description: Everything shown when a reader clicks the "Mythic+" tab. Paste talent import strings exactly as they are.
    - name: delves
      label: 'Tab: Delves'
      type: rich-text
      description: Everything shown when a reader clicks the "Delves" tab. Paste talent import strings exactly as they are.
    - name: flowchart
      label: 'Tab: Flowchart'
      type: rich-text
      description: Everything shown when a reader clicks the "Flowchart" tab. Paste talent import strings exactly as they
        are.
    - name: omniumfolio
      label: 'Tab: Omnium Folio'
      type: rich-text
      description: Everything shown when a reader clicks the "Omnium Folio" tab. Paste talent import strings exactly as they
        are.
  - name: cooldowns
    label: Abilities
    type: object
    fields:
    - name: heading
      label: Section heading
      type: string
      description: The title shown above these tabs.
    - name: intro
      label: Text above the tabs
      type: rich-text
      description: Optional. Shown between the heading and the tabs.
    - name: celestialconduit
      label: 'Tab: Celestial Conduit'
      type: rich-text
      description: Everything shown when a reader clicks the "Celestial Conduit" tab. Paste talent import strings exactly
        as they are.
    - name: fortifyingbrew
      label: 'Tab: Fortifying Brew'
      type: rich-text
      description: Everything shown when a reader clicks the "Fortifying Brew" tab. Paste talent import strings exactly as
        they are.
    - name: invokexuen
      label: 'Tab: Invoke Xuen'
      type: rich-text
      description: Everything shown when a reader clicks the "Invoke Xuen" tab. Paste talent import strings exactly as they
        are.
    - name: touchofdeath
      label: 'Tab: Touch of Death'
      type: rich-text
      description: Everything shown when a reader clicks the "Touch of Death" tab. Paste talent import strings exactly as
        they are.
    - name: touchofkarma
      label: 'Tab: Touch of Karma'
      type: rich-text
      description: Everything shown when a reader clicks the "Touch of Karma" tab. Paste talent import strings exactly as
        they are.
    - name: zenith
      label: 'Tab: Zenith'
      type: rich-text
      description: Everything shown when a reader clicks the "Zenith" tab. Paste talent import strings exactly as they are.
  - name: priority
    label: Priority Lists
    type: object
    fields:
    - name: singletarget
      label: Single-target priority
      type: object
      fields:
      - name: heading
        label: Section heading
        type: string
        description: The title shown above these tabs.
      - name: intro
        label: Text above the tabs
        type: rich-text
        description: Optional. Shown between the heading and the tabs.
      - name: default_shadopan
        label: 'Tab: Default SP'
        type: rich-text
        description: Everything shown when a reader clicks the "Default SP" tab. Paste talent import strings exactly as they
          are.
      - name: default_conduit
        label: 'Tab: Default Conduit'
        type: rich-text
        description: Everything shown when a reader clicks the "Default Conduit" tab. Paste talent import strings exactly
          as they are.
      - name: advanced_shadopan
        label: 'Tab: Advanced Shado-Pan'
        type: rich-text
        description: Everything shown when a reader clicks the "Advanced Shado-Pan" tab. Paste talent import strings exactly
          as they are.
      - name: advanced_conduit
        label: 'Tab: Advanced Conduit'
        type: rich-text
        description: Everything shown when a reader clicks the "Advanced Conduit" tab. Paste talent import strings exactly
          as they are.
    - name: aoe
      label: AOE priority
      type: object
      fields:
      - name: heading
        label: Section heading
        type: string
        description: The title shown above these tabs.
      - name: intro
        label: Text above the tabs
        type: rich-text
        description: Optional. Shown between the heading and the tabs.
      - name: shadopan
        label: 'Tab: Shado-Pan'
        type: rich-text
        description: Everything shown when a reader clicks the "Shado-Pan" tab. Paste talent import strings exactly as they
          are.
      - name: conduit
        label: 'Tab: Conduit of the Celestials'
        type: rich-text
        description: Everything shown when a reader clicks the "Conduit of the Celestials" tab. Paste talent import strings
          exactly as they are.
  - name: openers
    label: Openers
    type: object
    fields:
    - name: heading
      label: Section heading
      type: string
      description: The title shown above these tabs.
    - name: intro
      label: Text above the tabs
      type: rich-text
      description: Optional. Shown between the heading and the tabs.
    - name: shadopan
      label: 'Tab: Shado-Pan'
      type: rich-text
      description: Everything shown when a reader clicks the "Shado-Pan" tab. Paste talent import strings exactly as they
        are.
    - name: conduit
      label: 'Tab: Conduit of the Celestials'
      type: rich-text
      description: Everything shown when a reader clicks the "Conduit of the Celestials" tab. Paste talent import strings
        exactly as they are.
  - name: body
    label: Rest of the guide
    type: rich-text
    description: 'Everything below the tabbed sections: ability notes, gearing, enchants, macros, changelog.'
  - name: slug
    label: Page address
    type: string
    hidden: true
  - name: guide_type
    label: Guide type
    type: string
    hidden: true
  - name: wp_id
    type: number
    hidden: true
  - name: original_url
    type: string
    hidden: true
- name: authors
  label: Authors
  type: file
  path: blog/authors.yml
  format: code
  options:
    language: yaml
