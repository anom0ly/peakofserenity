name: Build site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The temporary barebones site (see docusaurus.config.js) must keep building too.
      - run: npm run build
        env:
          MIGRATION_MODE: 'true'
          PODCAST_MEDIA_URL: https://media.example.com
